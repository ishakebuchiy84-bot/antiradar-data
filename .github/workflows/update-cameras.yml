name: Update cameras
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    paths: ["data/manual.json", "scripts/build_cameras.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python scripts/build_cameras.py
      - name: Commit
        run: |
          git config user.name "antiradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cameras.json data/changes.json data/official_sample.txt
          git diff --cached --quiet || (git commit -m "Update cameras" && git push)
